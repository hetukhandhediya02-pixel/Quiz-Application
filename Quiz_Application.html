
<!DOCTYPE html>
<html>
<head>
    <title>Quiz Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            text-align: center;
            padding: 40px;
        }

        .quiz-box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #bbb;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #217dbb;
        }

        #next {
            background: #27ae60;
        }
    </style>
</head>
<body>

<div class="quiz-box">
    <h1>Quiz Application</h1>
    <p id="progress"></p>
    <h3 id="question"></h3>
    <div id="options"></div>
    <p id="feedback"></p>
    <button id="next" onclick="nextQuestion()"
        style="display:none;">Next Question</button>
    <h3 id="result"></h3>
    <button id="restart" onclick="restartQuiz()"
        style="display:none;">Restart Quiz</button>
</div>

<script>
    const quiz = [
        {
            question: "1. Which language is used to create web pages?",
            options: ["Java", "HTML", "C", "Python"],
            answer: "HTML"
        },
        {
            question: "2. Which language styles a web page?",
            options: ["CSS", "SQL", "C++", "PHP"],
            answer: "CSS"
        },
        {
            question: "3. Which language adds interactivity to a web page?",
            options: ["HTML", "CSS", "JavaScript", "SQL"],
            answer: "JavaScript"
        },
        {
            question: "4. Which tag creates a hyperlink in HTML?",
            options: ["<p>", "<a>", "<h1>", "<img>"],
            answer: "<a>"
        },
        {
            question: "5. Which database language retrieves data?",
            options: ["HTML", "CSS", "SQL", "XML"],
            answer: "SQL"
        }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        document.getElementById("progress").textContent =
            "Question " + (current + 1) + " of " + quiz.length;

        document.getElementById("question").textContent =
            quiz[current].question;

        document.getElementById("feedback").textContent = "";
        document.getElementById("next").style.display = "none";

        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        quiz[current].options.forEach(function(option) {
            const btn = document.createElement("button");
            btn.textContent = option;
            btn.onclick = function() {
                checkAnswer(option, btn);
            };
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(option, btn) {
        if (answered) return;
        answered = true;

        if (option === quiz[current].answer) {
            score++;
            document.getElementById("feedback").textContent =
                "Correct Answer!";
        } else {
            document.getElementById("feedback").textContent =
                "Wrong! Correct answer: " + quiz[current].answer;
        }

        document.querySelectorAll("#options button").forEach(function(b) {
            b.disabled = true;
        });

        document.getElementById("next").style.display = "block";
    }

    function nextQuestion() {
        current++;

        if (current < quiz.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("progress").textContent = "Quiz Completed!";
        document.getElementById("question").textContent = "";
        document.getElementById("options").innerHTML = "";
        document.getElementById("feedback").textContent = "";
        document.getElementById("next").style.display = "none";

        document.getElementById("result").textContent =
            "Your Score: " + score + " / " + quiz.length +
            " (" + Math.round(score / quiz.length * 100) + "%)";

        document.getElementById("restart").style.display = "block";
    }

    function restartQuiz() {
        current = 0;
        score = 0;
        document.getElementById("result").textContent = "";
        document.getElementById("restart").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
